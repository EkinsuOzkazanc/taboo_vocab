<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Taboo Cards</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f5f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 1.2rem 1rem 2rem;
    color: #222;
  }
  .taboo-card {
    width: 100%;
    max-width: 340px;
    background: white;
    border-radius: 16px;
    border: 1px solid #e0e0e0;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    overflow: hidden;
    margin-bottom: 14px;
    min-height: 260px;
    display: flex;
    flex-direction: column;
  }
  .card-header {
    background: #a78bdc;
    padding: 16px 12px 12px;
    text-align: center;
  }
  .card-keyword {
    font-size: 30px;
    font-weight: 700;
    color: white;
    letter-spacing: 0.01em;
  }
  .card-taboo-list {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 10px 0 14px;
    list-style: none;
    text-align: center;
  }
  .card-taboo-list li {
    font-size: 17px;
    color: #333;
    padding: 5px 0;
    border-bottom: 1px solid #f0f0f0;
    margin: 0 20px;
  }
  .card-taboo-list li:last-child { border-bottom: none; }
  #timer-ring {
    position: relative;
    width: 68px; height: 68px;
    margin: 0 auto 10px;
  }
  #timer-ring svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: #e8e8e8; stroke-width: 5; }
  .ring-fg {
    fill: none; stroke: #7b68d4; stroke-width: 5;
    stroke-linecap: round;
    stroke-dasharray: 163; stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear, stroke 0.3s;
  }
  #timer-label {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 17px; font-weight: 600; color: #555;
  }
  .warn .ring-fg { stroke: #e53935 !important; }
  #top-bar {
    display: flex; justify-content: space-between;
    align-items: center; width: 100%; max-width: 340px;
    margin-bottom: 10px;
  }
  #score-display {
    font-size: 13px; color: #666; background: white;
    border: 1px solid #e0e0e0; border-radius: 20px; padding: 4px 12px;
  }
  #deck-display { font-size: 13px; color: #999; }
  #next-btn {
    display: none; width: 100%; max-width: 340px;
    padding: 14px 0; border-radius: 14px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    border: 1.5px solid #7b68d4; background: white;
    color: #7b68d4; font-family: inherit; margin-bottom: 10px;
  }
  #next-btn:active { transform: scale(0.96); }
  .action-row {
    display: flex; gap: 10px;
    width: 100%; max-width: 340px; margin-bottom: 10px;
  }
  .act-btn {
    flex: 1; padding: 14px 0; border-radius: 14px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    border: none; font-family: inherit;
  }
  .act-btn:active { transform: scale(0.95); }
  .act-btn:disabled { opacity: 0.4; }
  #pass-btn { background: #fff3e0; color: #b36200; }
  #done-btn { background: #e6f4ea; color: #256029; }
  #skip-btn {
    background: none; border: none; color: #bbb;
    font-size: 12px; cursor: pointer; text-decoration: underline;
    font-family: inherit; margin-bottom: 6px;
  }
  #reset-btn {
    background: none; border: none; color: #ccc;
    font-size: 12px; cursor: pointer; text-decoration: underline;
    font-family: inherit; margin-top: 6px;
  }
  #game-screen {
    display: flex; flex-direction: column;
    align-items: center; width: 100%;
  }
  #round-done-screen {
    display: none; flex-direction: column;
    align-items: center; width: 100%; max-width: 360px;
    text-align: center; padding-top: 3rem;
  }
  #round-done-screen .big { font-size: 52px; margin-bottom: 12px; }
  #round-done-screen h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  #round-done-screen p { color: #888; font-size: 14px; margin-bottom: 6px; }
  .round-btn {
    width: 100%; padding: 14px 0; border-radius: 14px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    border: 1.5px solid #ddd; background: white;
    color: #444; font-family: inherit; margin-top: 12px;
  }
  .round-btn:active { transform: scale(0.96); }
</style>
</head>
<body>

<div id="game-screen">
  <div id="top-bar">
    <div id="score-display">✅ Done: <span id="done-count">0</span></div>
    <div id="deck-display">Card <span id="card-num">1</span> of <span id="card-total">0</span></div>
  </div>

  <div id="timer-ring">
    <svg width="68" height="68" viewBox="0 0 68 68">
      <circle class="ring-bg" cx="34" cy="34" r="26"/>
      <circle class="ring-fg" id="timer-arc" cx="34" cy="34" r="26"/>
    </svg>
    <div id="timer-label">1:00</div>
  </div>

  <div class="taboo-card">
    <div class="card-header">
      <div class="card-keyword" id="card-keyword"></div>
    </div>
    <ul class="card-taboo-list" id="card-taboo-list"></ul>
  </div>

  <button id="next-btn" onclick="nextCard()">Next card →</button>

  <div class="action-row">
    <button class="act-btn" id="pass-btn" onclick="passCard()">↩ Pass</button>
    <button class="act-btn" id="done-btn" onclick="doneCard()">✓ Done</button>
  </div>

  <button id="skip-btn" onclick="skipTimer()">skip timer</button>
  <button id="reset-btn" onclick="startGame()">↺ reshuffle all cards</button>
</div>

<div id="round-done-screen">
  <div class="big">🎉</div>
  <h2>Round complete!</h2>
  <p id="round-summary"></p>
  <p id="pass-note" style="display:none; color:#b36200; font-size:13px;"></p>
  <button class="round-btn" id="next-round-btn" onclick="startNextRound()">Play passed cards again</button>
  <button class="round-btn" onclick="startGame()" style="color:#bbb; border-color:#eee; font-size:13px; margin-top:4px;">Reshuffle all cards</button>
</div>

<script>
const CARDS = [
  { word: "bird", taboo: ["fly", "wing", "feather", "nest", "animal"] },
  { word: "insect", taboo: ["bug", "small", "ant", "fly", "legs"] },
  { word: "reptile", taboo: ["snake", "cold", "lizard", "scales", "animal"] },
  { word: "mammal", taboo: ["animal", "warm", "fur", "baby", "human"] },
  { word: "wild", taboo: ["nature", "free", "jungle", "tame", "animal"] },
  { word: "huge", taboo: ["big", "large", "giant", "size", "very"] },
  { word: "enormous", taboo: ["big", "huge", "large", "giant", "great"] },
  { word: "furry", taboo: ["hair", "soft", "animal", "fluffy", "touch"] },
  { word: "quiet", taboo: ["silent", "noise", "loud", "sound", "speak"] },
  { word: "scary", taboo: ["afraid", "fear", "danger", "horror", "dark"] },
  { word: "quick", taboo: ["fast", "speed", "slow", "run", "move"] },
  { word: "strong", taboo: ["power", "weak", "muscle", "heavy", "force"] },
  { word: "dangerous", taboo: ["safe", "hurt", "careful", "harm", "risk"] },
  { word: "fast", taboo: ["quick", "speed", "slow", "run", "move"] },
  { word: "slow", taboo: ["fast", "speed", "move", "turtle", "quick"] },
  { word: "tail", taboo: ["animal", "back", "dog", "wag", "end"] },
  { word: "tusk", taboo: ["elephant", "tooth", "long", "white", "point"] },
  { word: "paw", taboo: ["foot", "dog", "cat", "animal", "claw"] },
  { word: "wing", taboo: ["fly", "bird", "feather", "arm", "air"] },
  { word: "bear", taboo: ["animal", "forest", "big", "honey", "fur"] },
  { word: "lion", taboo: ["cat", "Africa", "roar", "mane", "animal"] },
  { word: "tiger", taboo: ["stripes", "cat", "India", "jungle", "animal"] },
  { word: "wolf", taboo: ["dog", "forest", "howl", "pack", "wild"] },
  { word: "giraffe", taboo: ["tall", "neck", "Africa", "spots", "animal"] },
  { word: "monkey", taboo: ["tree", "banana", "jump", "jungle", "animal"] },
  { word: "elephant", taboo: ["big", "trunk", "tusk", "Africa", "animal"] },
  { word: "zebra", taboo: ["stripes", "horse", "Africa", "black", "white"] },
  { word: "penguin", taboo: ["bird", "cold", "ice", "swim", "black"] },
  { word: "parrot", taboo: ["bird", "talk", "colour", "feather", "fly"] },
  { word: "snake", taboo: ["long", "reptile", "bite", "no legs", "hiss"] },
  { word: "crocodile", taboo: ["reptile", "teeth", "river", "green", "bite"] },
  { word: "gorilla", taboo: ["monkey", "big", "Africa", "jungle", "strong"] },
  { word: "leopard", taboo: ["spots", "cat", "Africa", "fast", "jungle"] },
  { word: "whale", taboo: ["ocean", "big", "mammal", "swim", "blue"] },
  { word: "eagle", taboo: ["bird", "fly", "mountain", "wing", "big"] },
  { word: "shark", taboo: ["fish", "ocean", "teeth", "swim", "danger"] },
  { word: "seal", taboo: ["ocean", "fish", "swim", "cold", "fur"] },
  { word: "seagull", taboo: ["bird", "sea", "fly", "white", "beach"] },
  { word: "farm", taboo: ["animal", "field", "food", "cow", "country"] },
  { word: "field", taboo: ["grass", "open", "farm", "green", "flat"] },
  { word: "forest", taboo: ["tree", "wood", "green", "animal", "dark"] },
  { word: "jungle", taboo: ["tree", "hot", "animal", "green", "tropical"] },
  { word: "river", taboo: ["water", "flow", "fish", "lake", "long"] },
  { word: "coast", taboo: ["sea", "beach", "water", "land", "cliff"] },
  { word: "savanna", taboo: ["Africa", "grass", "flat", "lion", "dry"] },
  { word: "ocean", taboo: ["sea", "water", "big", "fish", "blue"] },
  { word: "sky", taboo: ["blue", "cloud", "above", "air", "high"] },
  { word: "national park", taboo: ["nature", "animals", "wild", "trees", "visit"] },
  { word: "climate", taboo: ["weather", "hot", "cold", "temperature", "season"] },
  { word: "continent", taboo: ["Africa", "land", "map", "country", "big"] },
  { word: "desert", taboo: ["sand", "hot", "dry", "camel", "water"] },
  { word: "valley", taboo: ["mountain", "low", "river", "between", "hill"] },
  { word: "lake", taboo: ["water", "fish", "swim", "river", "round"] },
  { word: "rock", taboo: ["stone", "hard", "mountain", "grey", "heavy"] },
  { word: "season", taboo: ["summer", "winter", "weather", "spring", "autumn"] },
  { word: "temperature", taboo: ["hot", "cold", "weather", "degree", "climate"] },
  { word: "sand dune", taboo: ["sand", "desert", "hill", "wind", "shape"] },
  { word: "coral reef", taboo: ["ocean", "fish", "colour", "underwater", "sea"] },
  { word: "canyon", taboo: ["rock", "deep", "valley", "river", "America"] },
  { word: "island", taboo: ["sea", "water", "land", "beach", "small"] },
  { word: "tower", taboo: ["tall", "building", "high", "city", "climb"] },
  { word: "tour", taboo: ["travel", "visit", "trip", "group", "guide"] },
  { word: "journey", taboo: ["travel", "trip", "long", "go", "road"] },
  { word: "trip", taboo: ["travel", "journey", "holiday", "visit", "go"] },
  { word: "sightseeing", taboo: ["tourist", "visit", "travel", "city", "look"] },
  { word: "beach", taboo: ["sand", "sea", "swim", "holiday", "sun"] },
  { word: "museum", taboo: ["art", "history", "visit", "building", "old"] },
  { word: "zoo", taboo: ["animal", "visit", "cage", "wild", "park"] },
  { word: "amusement park", taboo: ["ride", "fun", "children", "roller", "theme"] },
  { word: "view", taboo: ["see", "look", "scenery", "beautiful", "window"] },
  { word: "bridge", taboo: ["river", "cross", "road", "water", "over"] },
  { word: "seaside", taboo: ["sea", "beach", "holiday", "coast", "water"] }
];

const CIRC = 2 * Math.PI * 26;
let deck = [], passedCards = [], doneCount = 0, currentCard = null;
let timerInterval = null, secondsLeft = 60, actionTaken = false;

function startGame() {
  doneCount = 0; passedCards = [];
  deck = shuffle([...CARDS]);
  document.getElementById('done-count').textContent = 0;
  document.getElementById('game-screen').style.display = 'flex';
  document.getElementById('round-done-screen').style.display = 'none';
  showNextCard();
}

function showNextCard() {
  if (deck.length === 0) { endRound(); return; }
  currentCard = deck.shift();
  document.getElementById('card-keyword').textContent = currentCard.word;
  const list = document.getElementById('card-taboo-list');
  list.innerHTML = '';
  currentCard.taboo.forEach(t => {
    const li = document.createElement('li');
    li.textContent = t;
    list.appendChild(li);
  });
  const seen = CARDS.length - deck.length;
  document.getElementById('card-num').textContent = seen;
  document.getElementById('card-total').textContent = CARDS.length;
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('pass-btn').disabled = false;
  document.getElementById('done-btn').disabled = false;
  actionTaken = false;
  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  secondsLeft = 60;
  document.getElementById('timer-ring').classList.remove('warn');
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    secondsLeft--;
    updateTimerDisplay();
    if (secondsLeft <= 10) document.getElementById('timer-ring').classList.add('warn');
    if (secondsLeft <= 0) { clearInterval(timerInterval); timeUp(); }
  }, 1000);
}

function updateTimerDisplay() {
  const s = Math.max(0, secondsLeft);
  document.getElementById('timer-label').textContent =
    Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  document.getElementById('timer-arc').style.strokeDashoffset = CIRC * (1 - s / 60);
}

function timeUp() {
  if (!actionTaken) document.getElementById('next-btn').style.display = 'block';
}

function skipTimer() {
  clearInterval(timerInterval); secondsLeft = 0;
  updateTimerDisplay(); timeUp();
}

function passCard() {
  if (actionTaken) return;
  actionTaken = true;
  clearInterval(timerInterval);
  passedCards.push(currentCard);
  document.getElementById('pass-btn').disabled = true;
  document.getElementById('done-btn').disabled = true;
  document.getElementById('next-btn').style.display = 'block';
}

function doneCard() {
  if (actionTaken) return;
  actionTaken = true;
  clearInterval(timerInterval);
  doneCount++;
  document.getElementById('done-count').textContent = doneCount;
  document.getElementById('pass-btn').disabled = true;
  document.getElementById('done-btn').disabled = true;
  document.getElementById('next-btn').style.display = 'block';
}

function nextCard() {
  document.getElementById('next-btn').style.display = 'none';
  showNextCard();
}

function endRound() {
  document.getElementById('game-screen').style.display = 'none';
  document.getElementById('round-done-screen').style.display = 'flex';
  document.getElementById('round-summary').textContent =
    '✅ ' + doneCount + ' done · ↩ ' + passedCards.length + ' passed';
  const hasPass = passedCards.length > 0;
  document.getElementById('next-round-btn').style.display = hasPass ? 'block' : 'none';
  const note = document.getElementById('pass-note');
  if (hasPass) {
    note.style.display = 'block';
    note.textContent = passedCards.length + ' passed card' + (passedCards.length > 1 ? 's' : '') + ' will be reshuffled.';
  } else { note.style.display = 'none'; }
}

function startNextRound() {
  deck = shuffle([...passedCards]);
  passedCards = [];
  document.getElementById('round-done-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'flex';
  showNextCard();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

startGame();
</script>
</body>
</html>
