<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Taboo Cards</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f5f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 1.2rem 1rem 2rem;
    color: #222;
  }
  #start-screen {
    display: flex; flex-direction: column; align-items: center;
    width: 100%; max-width: 340px; margin-top: 2rem; gap: 1.1rem;
  }
  #start-screen .logo { font-size: 48px; }
  #start-screen h1 { font-size: 22px; font-weight: 700; color: #333; }
  .section-label {
    font-size: 12px; color: #aaa; text-transform: uppercase;
    letter-spacing: 0.06em; align-self: flex-start; margin-bottom: -4px;
  }
  .deck-list { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .deck-item {
    display: flex; align-items: center; gap: 12px;
    background: white; border: 1.5px solid #ddd;
    border-radius: 12px; padding: 12px 14px;
    cursor: pointer; transition: border-color 0.1s, background 0.1s;
    user-select: none;
  }
  .deck-item.selected { border-color: #7b68d4; background: #f3f0fd; }
  .deck-check {
    width: 20px; height: 20px; border-radius: 5px;
    border: 1.5px solid #ccc; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; font-size: 13px;
    transition: background 0.1s, border-color 0.1s;
  }
  .deck-item.selected .deck-check { background: #7b68d4; border-color: #7b68d4; color: white; }
  .deck-info { flex: 1; }
  .deck-name { font-size: 15px; font-weight: 600; color: #333; }
  .deck-meta { font-size: 12px; color: #aaa; margin-top: 2px; }
  .mix-note { font-size: 12px; color: #7b68d4; text-align: center; display: none; }
  .timer-picker { display: flex; gap: 10px; width: 100%; }
  .timer-opt {
    flex: 1; padding: 11px 0; border-radius: 12px; border: 1.5px solid #ddd;
    background: white; font-size: 15px; font-weight: 600;
    color: #888; cursor: pointer; font-family: inherit;
  }
  .timer-opt.selected { border-color: #7b68d4; color: #7b68d4; background: #f3f0fd; }
  #start-btn {
    width: 100%; padding: 16px 0; border-radius: 14px;
    font-size: 17px; font-weight: 700; cursor: pointer;
    border: none; background: #7b68d4; color: white;
    font-family: inherit; letter-spacing: 0.02em;
    opacity: 0.4; pointer-events: none; transition: opacity 0.15s;
  }
  #start-btn.ready { opacity: 1; pointer-events: all; }
  #start-btn:active { transform: scale(0.97); }

  /* ── GAME SCREEN ── */
  #game-screen { display: none; flex-direction: column; align-items: center; width: 100%; }
  #active-turn { display: none; flex-direction: column; align-items: center; width: 100%; }

  #top-bar {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 380px; margin-bottom: 8px;
  }
  #score-display {
    background: #222; color: white; border-radius: 20px;
    padding: 6px 18px; font-size: 16px; font-weight: 700;
    letter-spacing: 0.01em;
  }
  #score-display span { font-size: 22px; font-weight: 800; }
  #deck-display { font-size: 13px; color: #999; }

  /* timer */
  #timer-ring { position: relative; width: 88px; height: 88px; margin: 0 auto 8px; }
  #timer-ring svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: #e8e8e8; stroke-width: 6; }
  .ring-fg {
    fill: none; stroke: #7b68d4; stroke-width: 6; stroke-linecap: round;
    stroke-dasharray: 213; stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear, stroke 0.3s;
  }
  #timer-label {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 21px; font-weight: 700; color: #444;
  }
  .warn .ring-fg { stroke: #e53935 !important; }
  .warn #timer-label { color: #e53935; }

  /* card */
  .taboo-card {
    width: 100%; max-width: 380px; background: white;
    border-radius: 20px; border: 1px solid #e0e0e0;
    box-shadow: 0 4px 20px rgba(0,0,0,0.09);
    overflow: hidden; margin-bottom: 12px;
    min-height: 300px; display: flex; flex-direction: column;
  }
  .card-header { background: #a78bdc; padding: 20px 16px 16px; text-align: center; }
  .card-deck-tag { font-size: 11px; color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .card-keyword { font-size: 36px; font-weight: 800; color: white; letter-spacing: -0.01em; }
  .card-taboo-list {
    flex: 1; display: flex; flex-direction: column;
    justify-content: center; padding: 12px 0 16px;
    list-style: none; text-align: center;
  }
  .card-taboo-list li {
    font-size: 19px; color: #333; padding: 6px 0;
    border-bottom: 1px solid #f0f0f0; margin: 0 24px;
  }
  .card-taboo-list li:last-child { border-bottom: none; }

  /* action buttons */
  .action-row { display: flex; gap: 12px; width: 100%; max-width: 380px; margin-bottom: 10px; }
  .act-btn {
    flex: 1; padding: 18px 0; border-radius: 16px; font-size: 18px;
    font-weight: 800; cursor: pointer; border: none; font-family: inherit;
    transition: opacity 0.1s, transform 0.08s;
    letter-spacing: 0.01em;
  }
  .act-btn:active { transform: scale(0.94); }
  #pass-btn { background: #ef4444; color: white; }
  #done-btn { background: #22c55e; color: white; }
  .act-btn.flash { opacity: 0.45; }

  /* between-turn screen */
  #between-turn {
    display: none; flex-direction: column; align-items: center;
    width: 100%; max-width: 380px; text-align: center; gap: 10px;
    padding-top: 1rem;
  }
  #between-turn .turn-score-label { font-size: 14px; color: #aaa; text-transform: uppercase; letter-spacing: 0.06em; }
  #between-turn .turn-score-num { font-size: 72px; font-weight: 900; color: #22c55e; line-height: 1; }
  #between-turn .turn-score-sub { font-size: 15px; color: #888; }
  #start-turn-btn {
    width: 100%; padding: 18px 0; border-radius: 16px; font-size: 18px;
    font-weight: 800; cursor: pointer; border: none;
    background: #3b82f6; color: white; font-family: inherit;
    margin-top: 8px; letter-spacing: 0.01em;
  }
  #start-turn-btn:active { transform: scale(0.96); }

  #reset-btn {
    background: none; border: none; color: #ccc; font-size: 12px;
    cursor: pointer; text-decoration: underline; font-family: inherit; margin-top: 10px;
  }

  /* round done screen */
  #round-done-screen {
    display: none; flex-direction: column; align-items: center;
    width: 100%; max-width: 380px; text-align: center; padding-top: 3rem; gap: 6px;
  }
  #round-done-screen .big { font-size: 52px; margin-bottom: 8px; }
  #round-done-screen h2 { font-size: 20px; font-weight: 700; }
  #round-done-screen p { color: #888; font-size: 14px; }
  .round-btn {
    width: 100%; padding: 16px 0; border-radius: 14px; font-size: 16px;
    font-weight: 700; cursor: pointer; border: 1.5px solid #ddd;
    background: white; color: #444; font-family: inherit; margin-top: 10px;
  }
  .round-btn:active { transform: scale(0.96); }
</style>
</head>
<body>

<div id="start-screen">
  <div class="logo">🃏</div>
  <h1>Taboo Cards</h1>
  <span class="section-label">Select deck(s)</span>
  <div class="deck-list" id="deck-list"></div>
  <div class="mix-note" id="mix-note">Cards from all selected decks will be shuffled together.</div>
  <span class="section-label">Timer per turn</span>
  <div class="timer-picker">
    <button class="timer-opt selected" onclick="selectTimer(1, this)">1 min</button>
    <button class="timer-opt" onclick="selectTimer(2, this)">2 min</button>
  </div>
  <button id="start-btn" onclick="startGame()">Start ▶</button>
</div>

<div id="game-screen">
  <div id="top-bar">
    <div id="score-display">✅ <span id="done-count">0</span></div>
    <div id="deck-display">Card <span id="card-num">1</span> of <span id="card-total">0</span></div>
  </div>

  <!-- active turn -->
  <div id="active-turn">
    <div id="timer-ring">
      <svg width="88" height="88" viewBox="0 0 88 88">
        <circle class="ring-bg" cx="44" cy="44" r="34"/>
        <circle class="ring-fg" id="timer-arc" cx="44" cy="44" r="34"/>
      </svg>
      <div id="timer-label">1:00</div>
    </div>
    <div class="taboo-card">
      <div class="card-header">
        <div class="card-deck-tag" id="card-deck-tag"></div>
        <div class="card-keyword" id="card-keyword"></div>
      </div>
      <ul class="card-taboo-list" id="card-taboo-list"></ul>
    </div>
    <div class="action-row">
      <button class="act-btn" id="pass-btn" onclick="passCard()">↩ Pass</button>
      <button class="act-btn" id="done-btn" onclick="doneCard()">✓ Done</button>
    </div>
  </div>

  <!-- between turns -->
  <div id="between-turn">
    <div class="turn-score-label">This turn</div>
    <div class="turn-score-num" id="turn-score">0</div>
    <div class="turn-score-sub" id="turn-score-sub"></div>
    <button id="start-turn-btn" onclick="startTurn()">▶ Start turn</button>
    <button id="reset-btn" onclick="goToStart()">← back to start</button>
  </div>
</div>

<div id="round-done-screen">
  <div class="big">🎉</div>
  <h2>Round complete!</h2>
  <p id="round-summary"></p>
  <p id="pass-note" style="display:none; color:#b36200; font-size:13px;"></p>
  <button class="round-btn" id="next-round-btn" onclick="startNextRound()">Play passed cards again</button>
  <button class="round-btn" onclick="goToStart()" style="color:#bbb; border-color:#eee; font-size:13px;">Back to start</button>
</div>

// ── STATE ──────────────────────────────────────────────────────────────────
const CIRC = 2 * Math.PI * 34;
let selectedDeckIds = [], timerDuration = 60;
let deck = [], passedCards = [], doneCount = 0, currentCard = null;
let timerInterval = null, secondsLeft = 60, timerRunning = false, totalCards = 0;
let turnDoneCount = 0;

// ── INIT ───────────────────────────────────────────────────────────────────
function init() {
  const list = document.getElementById('deck-list');
  list.innerHTML = '';
  DECKS.forEach(d => {
    const el = document.createElement('div');
    el.className = 'deck-item';
    el.dataset.id = d.id;
    el.innerHTML = `<div class="deck-check"></div>
      <div class="deck-info">
        <div class="deck-name">${d.name}</div>
        <div class="deck-meta">${d.cards.length} cards · ${d.description}</div>
      </div>`;
    el.addEventListener('click', () => toggleDeck(d.id, el));
    list.appendChild(el);
  });
}

function toggleDeck(id, el) {
  if (selectedDeckIds.includes(id)) {
    selectedDeckIds = selectedDeckIds.filter(x => x !== id);
    el.classList.remove('selected');
    el.querySelector('.deck-check').textContent = '';
  } else {
    selectedDeckIds.push(id);
    el.classList.add('selected');
    el.querySelector('.deck-check').textContent = '✓';
  }
  document.getElementById('start-btn').classList.toggle('ready', selectedDeckIds.length > 0);
  document.getElementById('mix-note').style.display = selectedDeckIds.length > 1 ? 'block' : 'none';
}

function selectTimer(mins, btn) {
  timerDuration = mins * 60;
  document.querySelectorAll('.timer-opt').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

// ── GAME ───────────────────────────────────────────────────────────────────
function startGame() {
  if (!selectedDeckIds.length) return;
  doneCount = 0; passedCards = [];
  const combined = [];
  selectedDeckIds.forEach(id => {
    const d = DECKS.find(x => x.id === id);
    if (d) d.cards.forEach(c => combined.push({ ...c, deckName: d.name }));
  });
  totalCards = combined.length;
  deck = shuffle(combined);
  document.getElementById('done-count').textContent = 0;
  document.getElementById('card-total').textContent = totalCards;
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('round-done-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'flex';
  showBetweenTurn(true);
}

function showBetweenTurn(isFirst) {
  clearInterval(timerInterval); timerRunning = false;
  document.getElementById('active-turn').style.display = 'none';
  document.getElementById('between-turn').style.display = 'flex';
  if (isFirst) {
    document.getElementById('turn-score').textContent = '';
    document.getElementById('turn-score-label').style.display = 'none';
    document.getElementById('turn-score-sub').textContent = '';
  } else {
    document.getElementById('turn-score-label').style.display = 'block';
    document.getElementById('turn-score').textContent = turnDoneCount;
    const remaining = deck.length;
    document.getElementById('turn-score-sub').textContent =
      turnDoneCount === 1 ? '1 card done this turn' : turnDoneCount + ' cards done this turn';
  }
}

function startTurn() {
  if (!deck.length) { endRound(); return; }
  turnDoneCount = 0;
  document.getElementById('between-turn').style.display = 'none';
  document.getElementById('active-turn').style.display = 'block';
  document.getElementById('pass-btn').disabled = false;
  document.getElementById('done-btn').disabled = false;
  currentCard = deck.shift();
  renderCard(currentCard);
  startTimer();
}

function renderCard(card) {
  document.getElementById('card-keyword').textContent = card.word;
  document.getElementById('card-deck-tag').textContent = selectedDeckIds.length > 1 ? card.deckName : '';
  const list = document.getElementById('card-taboo-list');
  list.innerHTML = '';
  card.taboo.forEach(t => {
    const li = document.createElement('li'); li.textContent = t; list.appendChild(li);
  });
  document.getElementById('card-num').textContent = totalCards - deck.length;
}

function startTimer() {
  clearInterval(timerInterval);
  secondsLeft = timerDuration; timerRunning = true;
  document.getElementById('timer-ring').classList.remove('warn');
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    secondsLeft--;
    updateTimerDisplay();
    if (secondsLeft <= 10) document.getElementById('timer-ring').classList.add('warn');
    if (secondsLeft <= 0) { clearInterval(timerInterval); timerRunning = false; timeUp(); }
  }, 1000);
}

function updateTimerDisplay() {
  const s = Math.max(0, secondsLeft);
  document.getElementById('timer-label').textContent =
    Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  document.getElementById('timer-arc').style.strokeDashoffset = CIRC * (1 - s / timerDuration);
}

function timeUp() {
  // disable buttons and show between-turn
  document.getElementById('pass-btn').disabled = true;
  document.getElementById('done-btn').disabled = true;
  setTimeout(() => showBetweenTurn(false), 400);
}

function flash(btn) { btn.classList.add('flash'); setTimeout(() => btn.classList.remove('flash'), 150); }

function passCard() {
  flash(document.getElementById('pass-btn'));
  passedCards.push(currentCard);
  showNextCardSameTurn();
}

function doneCard() {
  flash(document.getElementById('done-btn'));
  doneCount++;
  turnDoneCount++;
  document.getElementById('done-count').textContent = doneCount;
  showNextCardSameTurn();
}

function showNextCardSameTurn() {
  if (!deck.length) {
    // deck ran out mid-turn — end turn immediately
    clearInterval(timerInterval); timerRunning = false;
    document.getElementById('pass-btn').disabled = true;
    document.getElementById('done-btn').disabled = true;
    setTimeout(() => showBetweenTurn(false), 400);
    return;
  }
  currentCard = deck.shift();
  renderCard(currentCard);
}

function endRound() {
  clearInterval(timerInterval); timerRunning = false;
  document.getElementById('game-screen').style.display = 'none';
  document.getElementById('round-done-screen').style.display = 'flex';
  document.getElementById('round-summary').textContent =
    '✅ ' + doneCount + ' done · ↩ ' + passedCards.length + ' passed';
  const hasPass = passedCards.length > 0;
  document.getElementById('next-round-btn').style.display = hasPass ? 'block' : 'none';
  const note = document.getElementById('pass-note');
  note.style.display = hasPass ? 'block' : 'none';
  if (hasPass) note.textContent = passedCards.length + ' passed card' + (passedCards.length > 1 ? 's' : '') + ' will be reshuffled.';
}

function startNextRound() {
  deck = shuffle([...passedCards]); totalCards = deck.length; passedCards = [];
  document.getElementById('card-total').textContent = totalCards;
  document.getElementById('round-done-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'flex';
  timerRunning = false;
  showBetweenTurn(true);
}

function goToStart() {
  clearInterval(timerInterval); timerRunning = false;
  document.getElementById('game-screen').style.display = 'none';
  document.getElementById('round-done-screen').style.display = 'none';
  document.getElementById('start-screen').style.display = 'flex';
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

init();
</script>
